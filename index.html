<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Collection Vault</title>

    <link rel="stylesheet" href="style.css" />
    <script defer src="java.js"></script>
  </head>
  <body>
    <h1>🎵 THE MUSIC VAULT 🎵</h1>
    <h3>By Kevin Tan and Matt Del Campo</h3>
    <h2>TOTAL SONGS: <span id="totalItems"></span></h2>
    <h2>AVERAGE RATING: <span id="avgRating"></span></h2>
    <h2 id="mysteryTries"></h2>

    <button id="addBtn">ADD ITEM</button>
    <button id="removeBtn">REMOVE LAST</button>
    <button id="mergeBtn">MERGE VAULT</button>
    <button id="mysteryBtn">MYSTERY BOX</button>

    <ul id="vaultList"></ul>
    <div id="musicContainer"></div>

    <div>
      <button id="showAllBtn">Show All</button
      ><button id="filterBtn">Filter</button
      ><input id="inputText" type="text" placeholder="Rarity" />
    </div>
  </body>
</html>
